<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Optimizer — SEO·AEO·GEO + Gemini AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f1eb;--card:#fff;--cardAlt:#f0ebe3;--border:#ddd5c9;--text:#2c2418;--textSec:#6b5e4f;--textDim:#9e9183;--accent:#b84a1c;--accentBg:#fef3ec;--green:#2d7a50;--greenBg:#edf7f1;--red:#b83a2b;--blue:#2558a0;--blueBg:#eef4fb;--purple:#6d3cc7;--purpleBg:#f3effe;--gold:#a07608;--shadow:0 1px 3px rgba(44,36,24,.06)}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit}
a{color:var(--blue)}
.mono{font-family:'DM Mono',monospace}
.header{padding:28px 22px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--card),var(--bg))}
.header h1{font-size:21px;font-weight:700;font-family:'Libre Baskerville',serif}
.header p{font-size:11px;color:var(--textDim);margin-top:3px}
.types{display:flex;gap:5px;overflow-x:auto;padding:14px 18px 0}
.type-btn{padding:7px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:.15s}
.type-btn.active{border-color:var(--accent);background:var(--accentBg)}
.type-btn .lbl{font-size:11px;font-weight:500;color:var(--text)}
.type-btn.active .lbl{font-weight:700;color:var(--accent)}
.input-area{padding:12px 18px}
textarea{width:100%;min-height:110px;padding:14px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;line-height:1.7;resize:vertical;outline:none;font-family:inherit;box-shadow:var(--shadow)}
textarea:focus{border-color:var(--accent)}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-main{flex:1;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-main:disabled{background:var(--border);color:var(--textDim);cursor:not-allowed}
.btn-sec{padding:12px 14px;background:var(--card);color:var(--textSec);border:1.5px solid var(--border);border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.results{padding:0 18px 30px}
.score-row{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:16px 10px;background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:10px;box-shadow:var(--shadow)}
.score-label{font-size:10px;font-weight:700;margin-top:1px;text-align:center}
.quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.stat-box{padding:7px 4px;background:var(--card);border-radius:8px;border:1px solid var(--border);text-align:center;box-shadow:var(--shadow)}
.stat-box .val{font-size:16px;font-weight:800}
.stat-box .lab{font-size:9px;color:var(--textDim)}
.tabs{display:flex;gap:2px;margin-bottom:10px;background:var(--cardAlt);border-radius:10px;padding:3px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:9px 4px;background:transparent;border:1px solid transparent;border-radius:8px;font-size:11px;font-weight:500;color:var(--textDim);cursor:pointer}
.tab-btn.active{background:var(--card);border-color:var(--border);font-weight:700;color:var(--accent);box-shadow:var(--shadow)}
.panel{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.fold{margin-bottom:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.fold-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:none;border:none;cursor:pointer;text-align:left}
.fold-title{font-size:13px;font-weight:700}
.fold-arrow{font-size:16px;color:var(--textDim);transition:transform .2s}
.fold-arrow.open{transform:rotate(180deg)}
.fold-body{padding:0 16px 14px}
.bar-item{margin-bottom:14px}
.bar-top{display:flex;justify-content:space-between;margin-bottom:2px}
.bar-label{font-size:13px;font-weight:600}
.bar-score{font-size:13px;font-weight:700}
.bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .5s}
.bar-detail{font-size:11px;color:var(--textDim);margin-top:2px}
.tip-box{margin-top:5px;padding:7px 10px;background:var(--accentBg);border-radius:6px;font-size:11px;color:var(--accent);border-left:3px solid var(--accent);line-height:1.5;cursor:pointer}
.tip-detail{margin-top:6px;font-size:12px;color:var(--textSec);line-height:1.7}
.tip-why{padding:8px 10px;background:var(--cardAlt);border-radius:6px;border-left:3px solid var(--accent);margin:6px 0}
.platform-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-radius:10px;margin-bottom:6px;border:1px solid var(--border)}
.platform-icon{font-size:22px}
.platform-name{font-weight:700;font-size:13px}
.platform-prob{font-weight:800;font-size:15px}
.platform-bar{height:4px;background:var(--border);border-radius:2px;margin:4px 0;overflow:hidden}
.platform-fill{height:100%;border-radius:2px;transition:width .5s}
.platform-note{font-size:10px;color:var(--textDim)}
.platform-ref{font-size:9px;color:var(--blue);margin-top:1px}
.chat-container{display:flex;flex-direction:column;height:420px}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px}
.chat-bubble{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.chat-user{background:var(--accent);color:#fff;margin-left:auto}
.chat-model{background:var(--card);border:1px solid var(--border);color:var(--text)}
.chat-input-row{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:var(--card)}
.chat-input:focus{border-color:var(--accent)}
.chat-send{padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.chat-send:disabled{background:var(--border);cursor:not-allowed}
.empty{padding:50px 30px;text-align:center}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.3}
.suggest-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.suggest-chip{padding:6px 12px;background:var(--cardAlt);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--textSec);cursor:pointer}
.dot-pulse{display:flex;gap:4px;padding:10px 14px}
.dot-pulse span{width:8px;height:8px;border-radius:50%;background:var(--textDim);animation:pulse 1s infinite}
.dot-pulse span:nth-child(2){animation-delay:.2s}
.dot-pulse span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.impact-badge{font-size:10px;font-weight:700;color:var(--purple);background:var(--purpleBg);padding:1px 6px;border-radius:4px}
.suggestion-fold .tip-why strong{color:var(--accent)}
.paper-link{font-size:10px;color:var(--blue);margin-top:2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useCallback, useEffect, useRef } = React;

const TYPES = [
  { id:"blog", icon:"📝", label:"블로그/글" },
  { id:"webpage", icon:"🌐", label:"홈페이지" },
  { id:"youtube", icon:"🎬", label:"YouTube" },
  { id:"shorts", icon:"⚡", label:"Shorts/릴스" },
  { id:"sns", icon:"📱", label:"SNS" },
];

const PAPERS = {
  geo:{ title:"GEO: Generative Engine Optimization", venue:"ACM SIGKDD 2024", url:"https://arxiv.org/abs/2311.09735" },
  autogeo:{ title:"What Generative Search Engines Like and How to Optimize Web Content Cooperatively", venue:"arXiv 2025", url:"https://arxiv.org/abs/2510.11438" },
  beyond:{ title:"Beyond Retrieval: Modeling Confidence Decay in GEO", venue:"arXiv 2025", url:"https://arxiv.org/abs/2604.03656" },
  geoMech:{ title:"GEO: The Mechanics, Strategy, and Economic Impact of the Post-Search Era", venue:"ResearchGate 2025", url:"https://www.researchgate.net/publication/398120277" },
};

function analyze(text, ctype) {
  if (!text || text.trim().length < 10) return null;
  const lines = text.split("\n").filter(l=>l.trim());
  const words = text.split(/\s+/).filter(w=>w.length>0);
  const wc = words.length;
  const sents = text.split(/[.!?。]+/).filter(s=>s.trim().length>3);
  const sc = sents.length;
  const cnt = ps => ps.reduce((n,p)=>n+(text.match(p)||[]).length,0);
  const stats = cnt([/\d+(\.\d+)?%/g,/\d{1,3}(,\d{3})+/g,/\$\d+/g,/\d+배/g,/\d+\s*(만|억|조)/g,/\d+x/gi]);
  const cites = cnt([/\(.*?\d{4}.*?\)/g,/according to/gi,/에 따르면/g,/연구에 의하면/g,/\[[\d,\s]+\]/g,/출처\s*:/g,/research\s*(by|from|shows|found)/gi]);
  const quotes = (text.match(/[""\u201c][^""\u201d]+[""\u201d]|「[^」]+」/g)||[]).length;
  const heads = lines.filter(l=>/^#{1,6}\s/.test(l));
  const qH = heads.filter(h=>/\?|란|어떻게|무엇|왜|언제/.test(h)).length;
  const lsts = lines.filter(l=>/^\s*[-*•]\s/.test(l)||/^\s*\d+[.)]\s/.test(l)).length;
  const schema = (text.match(/schema|FAQ|HowTo|Article|스키마/gi)||[]).length;
  const eeat = (text.match(/expert|전문가|PhD|박사|교수|professor|경력|경험|저자|ORCID/gi)||[]).length;
  const htags = (text.match(/#[^\s#]+/g)||[]).length;
  const ctas = (text.match(/구독|팔로우|좋아요|공유|댓글|subscribe|follow|like|share|comment/gi)||[]).length;
  const fl = lines.find(l=>l.trim().length>20&&!/^[#<]/.test(l.trim()));
  const ansF = fl?fl.length<300&&fl.length>30:false;
  const avgSL = sc>0?wc/sc:wc;
  const flu = avgSL>5&&avgSL<25?1:.5;
  const freq={};
  words.forEach(w=>{const c=w.toLowerCase().replace(/[^a-z가-힣]/g,"");if(c.length>2)freq[c]=(freq[c]||0)+1});
  const stuf = wc>0?Math.max(...Object.values(freq),0)/wc>.05:false;
  const hook = /\?|!|알고|비밀|충격|꿀팁|방법|이유|진짜/.test(lines[0]||"");
  const isV = ["youtube","shorts"].includes(ctype);
  const isS = ["shorts","sns"].includes(ctype);

  const mk = ds => ds.map(d=>({...d, score:d.sf()}));

  const seoI = mk(isV?[
    {label:"제목 키워드 배치",sf:()=>heads.length>0?70:20,detail:`첫줄: ${(lines[0]||"").slice(0,25)}...`,tip:"제목 앞 40자 이내에 핵심 키워드 배치. YouTube·Google 모바일에서 40자 후 잘림.",tipWhy:"10,000+ 트렌딩 Shorts 분석: 4~6단어 명확한 제목이 최적.",ref:PAPERS.geo,extRef:"CRKLR (2026)",extUrl:"https://crklr.com/news/how-to-optimise-youtube-shorts-for-seo/"},
    {label:"설명문 분량",sf:()=>wc>100?100:wc>50?60:30,detail:`${wc}단어`,tip:"키워드 포함 100단어+ 스크립트 작성. YouTube는 설명문으로 영상 맥락 파악.",tipWhy:"YouTube와 Google 모두 설명문을 검색 인덱싱에 활용.",ref:PAPERS.geo,extRef:"HypeEdge (2025)",extUrl:"https://thehypedge.com/video-seo-in-2025-optimizing-youtube-short-form-video-for-search/"},
    {label:"해시태그",sf:()=>htags>=3?100:htags>0?50:0,detail:`${htags}개`,tip:"#Shorts + 니치 해시태그 3~5개 조합.",tipWhy:"범용 태그=카테고리 인식, 니치 태그=타겟 도달.",ref:PAPERS.geo},
    {label:"CTA",sf:()=>ctas>0?100:0,detail:ctas>0?`${ctas}개`:"없음",tip:"'구독', '좋아요', '댓글 남겨주세요' CTA 넣기.",tipWhy:"CTA가 참여율을 직접 높이며 알고리즘 배포 신호.",ref:PAPERS.geo},
    {label:"훅 (첫 3-5초)",sf:()=>hook?100:20,detail:hook?"✓ 강한 시작":"✗ 약함",tip:"첫 문장에 질문/충격적 사실/강한 주장.",tipWhy:"Shorts 알고리즘: 첫 3~5초 이탈 시 배포 급감.",ref:PAPERS.geo,extRef:"Versa Creative (2025)",extUrl:"https://versacreative.com/blog/how-the-youtube-shorts-algorithm-works-in-2025/"},
  ]:[
    {label:"제목/헤딩 구조",sf:()=>heads.length>=3?100:heads.length>=1?50:0,detail:`${heads.length}개`,tip:"H2/H3 3개 이상. 각 섹션이 독립적 '답변 단위'가 되어야 AI 추출 용이.",tipWhy:"AI는 페이지 단위가 아니라 문장/섹션 단위로 인용. 명확한 헤딩이 핵심.",ref:PAPERS.geo},
    {label:"콘텐츠 분량",sf:()=>wc>500?100:wc>200?60:30,detail:`${wc}단어`,tip:"300단어 이상의 포괄적 콘텐츠. 여러 각도에서 깊이 있게.",tipWhy:"Princeton: '얇은 페이지는 건너뛰어진다'. 후속 질문 예상하는 콘텐츠가 인용됨.",ref:PAPERS.geo},
    {label:"리스트/구조화",sf:()=>lsts>3?100:lsts>0?50:0,detail:`${lsts}개`,tip:"핵심 정보를 불릿/번호 리스트로 구조화. AI Overviews의 78%가 리스트.",tipWhy:"구조화 형식이 AI 추출·요약에 가장 적합.",ref:PAPERS.geo,extRef:"MAXAEO (2025)",extUrl:"https://maxaeo.com/what-is-answer-engine-optimization-aeo-your-2025-guide/"},
    {label:"키워드 밀도",sf:()=>stuf?20:100,detail:stuf?"⚠️ 과다":"적절",tip:"동일 단어 과다 반복 금지. GEO 9가지 전략 중 최하위.",tipWhy:"키워드 스터핑이 GEO에서 부정적/무의미한 효과.",ref:PAPERS.geo},
    {label:"가독성",sf:()=>Math.round(flu*100),detail:`평균 ${avgSL.toFixed(1)}단어/문장`,tip:"문장 10~20단어 유지. 유창성+통계 조합이 최강.",tipWhy:"유창성만으로 15~30% 향상. 유창성+통계=단일 대비 +5.5%.",ref:PAPERS.geo},
  ]);

  const aeoI = mk(isS?[
    {label:"즉각 가치 전달",sf:()=>hook?100:0,detail:hook?"✓":"✗",tip:"첫 프레임에서 핵심 가치 즉시 전달.",tipWhy:"85% 시청자가 15초 미만 선호, 숏폼 2.5x 참여율.",ref:PAPERS.geo},
    {label:"검색 가능 캡션",sf:()=>wc>20?80:30,detail:`${wc}단어`,tip:"타겟 키워드 포함 캡션 작성.",tipWhy:"Shorts는 Google 모바일 검색에도 노출. 메타데이터가 핵심.",ref:PAPERS.geo},
    {label:"해시태그 전략",sf:()=>htags>=3?100:htags>0?50:0,detail:`${htags}개`,tip:"범용+니치 해시태그 조합.",tipWhy:"범용=넓은 도달, 니치=관련 오디언스 타겟팅.",ref:PAPERS.geo},
  ]:[
    {label:"답변 우선 배치",sf:()=>ansF?100:0,detail:ansF?"✓ 간결한 첫 답변":"✗ 답변 지연",tip:"H2 바로 아래 40~60단어로 직접 답변. 상세는 그 아래.",tipWhy:"AEO의 '가장 중요한 전술적 전환'. AI는 질문-답변 쌍을 추출.",ref:PAPERS.geo,extRef:"MAXAEO (2025)",extUrl:"https://maxaeo.com/what-is-answer-engine-optimization-aeo-your-2025-guide/"},
    {label:"질문형 헤딩",sf:()=>qH>0?100:0,detail:`${qH}개`,tip:"H2를 '~란?', '어떻게 ~?', '왜 ~?' 형태로.",tipWhy:"사용자 AI 프롬프트와 동일한 형태의 헤딩이 인용 확률 증가.",ref:PAPERS.geo},
    {label:"스키마 마크업",sf:()=>schema>0?100:0,detail:schema>0?`${schema}개`:"없음",tip:"FAQPage, HowTo, Article JSON-LD 추가.",tipWhy:"스키마가 리치결과 + AI 정확한 데이터 추출 지원.",ref:PAPERS.geo,extRef:"PNA컴퍼니 (2026)",extUrl:"https://pnamarketing.co.kr/insights/ai-search-engine-optimization-strategy-2026"},
    {label:"E-E-A-T 신호",sf:()=>eeat>=3?100:eeat>0?50:0,detail:`${eeat}개`,tip:"저자명, 직함, ORCID, 최종 검토일 명시.",tipWhy:"E-E-A-T가 AI 신뢰·인용 결정의 핵심 기준.",ref:PAPERS.geo},
  ]);

  const geoI = mk([
    {label:"통계/수치",sf:()=>Math.min(100,stats*25),detail:`${stats}개`,tip:"모호한 표현 → 구체적 수치 교체. '크게 증가' → '47% 증가'.",tipWhy:"단일 최고 전략. 최대 40% 가시성 향상.",ref:PAPERS.geo,impact:"+40%"},
    {label:"출처 인용",sf:()=>Math.min(100,cites*30),detail:`${cites}개`,tip:"'(저자, 연도)' 또는 '~에 따르면' 패턴으로 학술·보고서 인용.",tipWhy:"5위 사이트 115.1% 가시성 증가. 중소 콘텐츠에 특히 유리.",ref:PAPERS.geo,impact:"+115%"},
    {label:"전문가 인용문",sf:()=>Math.min(100,quotes*35),detail:`${quotes}개`,tip:'전문가 발언을 큰따옴표("")로 포함.',tipWhy:"상위 3대 GEO 전략. AI가 인용문을 증거로 추출.",ref:PAPERS.geo,impact:"Top3"},
    {label:"유창성+통계",sf:()=>Math.round(flu*(stats>0?100:50)),detail:flu===1&&stats>0?"✓ 최강 조합":"미달성",tip:"자연스러운 문장 + 구체적 통계 함께 사용.",tipWhy:"이 조합이 단일 전략 대비 +5.5% 추가 향상. 모든 조합 중 최고.",ref:PAPERS.geo,impact:"+5.5%"},
  ]);

  const avg = its => Math.min(100,Math.round(its.reduce((s,i)=>s+i.score,0)/its.length));
  const sS=avg(seoI),aS=avg(aeoI),gS=avg(geoI);
  const ov=Math.round(sS*.3+aS*.3+gS*.4);

  const bp = Math.min(95,Math.round((stats>0?20:0)+(cites>0?18:0)+(quotes>0?12:0)+(ansF?15:0)+(heads.length>=3?8:0)+(!stuf?8:0)+flu*8+(eeat>0?6:0)));
  const plats=[
    {name:"ChatGPT",icon:"🤖",prob:Math.min(95,bp+(quotes>0?5:-10)),note:"Wikipedia 7.8%, Reddit +87%",ref:"Profound (2025)"},

function Gauge({score,size=100}){
  const [a,setA]=useState(0);
  useEffect(()=>{let i=0;const f=()=>{i+=2;if(i>=score){setA(score);return}setA(i);requestAnimationFrame(f)};requestAnimationFrame(f)},[score]);
  const r=size/2-8,c=2*Math.PI*r;
  const col=score>=70?"var(--green)":score>=40?"var(--gold)":"var(--red)";
  return React.createElement("svg",{width:size,height:size,viewBox:`0 0 ${size} ${size}`},
    React.createElement("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:"var(--border)",strokeWidth:5}),
    React.createElement("circle",{cx:size/2,cy:size/2,r,fill:"none",stroke:col,strokeWidth:5,strokeDasharray:c,strokeDashoffset:c-(a/100)*c,strokeLinecap:"round",transform:`rotate(-90 ${size/2} ${size/2})`,style:{transition:"stroke-dashoffset .6s"}}),
    React.createElement("text",{x:size/2,y:size/2+2,textAnchor:"middle",fill:col,fontSize:size/3.5,fontWeight:800,className:"mono"},a)
  );
}

  const [msgs,setMsgs]=useState([]);

              React.createElement("div",{className:"platform-note"},p.note),
              React.createElement("div",{className:"platform-ref"},"📚 ",p.ref)
            )
          ))
        ),
        tab==="chat" && React.createElement(GeminiChat,{analysis:result}),
        tab==="agent" && React.createElement(ExposureAgent,{text:text,ctype:ctype})
      )
    ),
    // Empty
    !result && React.createElement("div",{className:"empty"},
      React.createElement("div",{className:"empty-icon"},"✍️"),
      React.createElement("div",{style:{fontSize:13,color:"var(--textDim)",lineHeight:1.7}},"콘텐츠 유형 선택 → 글 붙여넣기 → ",React.createElement("span",{style:{color:"var(--accent)",fontWeight:700}},"분석 시작"))
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
